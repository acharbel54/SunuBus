name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Récupère les dépendances
        run: flutter pub get

      - name: Analyse statique (flutter analyze)
        run: flutter analyze

      - name: Tests unitaires et widgets (flutter test)
        run: flutter test
