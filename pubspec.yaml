name: sunu_bus
description: "SunuBus — suivi en temps réel (simulé) des bus de transport en commun à Dakar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestion d'état réactive, adaptée aux mises à jour temps réel (Timer -> StateNotifier)
  flutter_riverpod: ^2.5.1

  # Carte interactive basée sur OpenStreetMap (aucune clé API requise)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Formatage des dates (ex: date d'expiration de l'abonnement)
  intl: ^0.19.0
  google_fonts: ^8.2.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.7

  # Géolocalisation réelle de l'appareil (recherche d'itinéraire : "Ma position").
  geolocator: ^13.0.0
  # Notifications locales (arrivée de bus proche, rappel de trajet réservé).
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
